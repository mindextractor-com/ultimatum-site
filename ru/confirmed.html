<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<link rel="icon" type="image/jpeg" href="/images/cover-ru.jpg?v=2">
<title>Ты в списке — Ультиматум</title>
<meta name="description" content="Подписка на спецпредложения и контент автора «Ультиматума» подтверждена.">
<meta name="robots" content="noindex,follow">
<style>
/* Oswald — display face for all headings, matching the book cover.
   Variable (wght 400–700), latin + cyrillic subsets only. */
@font-face{font-family:'Oswald';src:url('/fonts/oswald-latin.woff2')format('woff2');font-weight:400 700;font-style:normal;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Oswald';src:url('/fonts/oswald-cyrillic.woff2')format('woff2');font-weight:400 700;font-style:normal;font-display:swap;unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Jost';src:url('/fonts/jost-variable.woff2')format('woff2');font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:'Ubuntu Mono';src:url('/fonts/ubuntu-mono-regular.woff2')format('woff2');font-weight:400;font-style:normal;font-display:swap}
:root{
  --font-display:'Oswald','Arial Narrow','Helvetica Neue Condensed',Impact,system-ui,sans-serif;
  --font-text:'Jost',system-ui,sans-serif;
  --font-mono:'Ubuntu Mono','Courier New',monospace;
  --l-bg:#ECEFF2;--l-text:#14151C;--l-muted:rgba(20,21,28,.55);--l-border:rgba(20,21,28,.1);
  --acc:#FF2A38;
  --px:clamp(1.25rem,5vw,4rem);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--l-bg);color:var(--l-text);font-family:var(--font-text);line-height:1.6;
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:var(--px);gap:.25rem}
.eyebrow{font-family:var(--font-mono);font-size:.625rem;letter-spacing:.3em;text-transform:uppercase;color:var(--acc);margin-bottom:1.25rem}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(2.25rem,7vw,4rem);line-height:1;letter-spacing:-.01em}
p{color:var(--l-muted);max-width:42ch;margin:1.25rem 0 2rem}
.home{display:inline-block;font-family:var(--font-mono);font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;
  text-decoration:none;color:var(--l-text);border:1px solid var(--l-border);padding:.7rem 1.4rem;border-radius:4px;transition:border-color .15s,color .15s}
.home:hover{border-color:var(--acc);color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
</style>
</head>
<body>
  <p class="eyebrow">Ультиматум</p>
  <h1>Ты в списке. На связи.</h1>
  <p>Адрес подтверждён — спецпредложения и контент от автора будут приходить прямо на почту.</p>
  <a class="home" href="/ru/">← На главную</a>
</body>
</html>
